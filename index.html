<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 7 - JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body id="cuerpo" >

    <div class="container my-5">
        <h1 class="text-center mb-4">Práctica 7: JavaScript Interactivo</h1>
        
        <section class="card p-4 mb-4 shadow-sm">
            <h3>a) Datos del Alumno</h3>
            <button id="btnDatos" class="btn btn-primary mt-2">Mostrar mis datos</button>
            <p id="parrafoDatos" class="mt-3 fw-bold text-secondary"></p>
        </section>

        <section class="card p-4 mb-4 shadow-sm">
            <h3>b) Calculadora de Calificaciones </h3>
            <div class="row g-3 mt-1">
                <div class="col-md-4">
                    <input type="number" id="p1" class="form-control" placeholder="Parcial 1">
                </div>
                <div class="col-md-4">
                    <input type="number" id="p2" class="form-control" placeholder="Parcial 2">
                </div>
                <div class="col-md-4">
                    <input type="number" id="p3" class="form-control" placeholder="Parcial 3">
                </div>
            </div>
            <button id="btnCalcular" class="btn btn-success mt-3">Calcular Promedio</button>
            <p id="resultado" class="mt-3 fs-5"></p>
        </section>

        <section class="card p-4 mb-4 shadow-sm">
            <h3>c) Lista Dinámica</h3>
            <div class="input-group mt-2">
                <input type="text" id="textoItem" class="form-control" placeholder="Escribe algo...">
                <button id="btnAgregar" class="btn btn-outline-primary">Agregar</button>
                <button id="btnLimpiar" class="btn btn-outline-danger">Limpiar</button>
            </div>
            <ul id="lista" class="list-group mt-3"></ul>
        </section>

        <section class="card p-4 mb-4 shadow-sm">
            <h3>d) Cambio de Estilos </h3>
            <p>Elige un tono:</p>
            <div class="d-flex gap-2">
                <button id="btnVapor" class="btn border" style="background-color: #E7A8FF;">Vaporwave</button>
                <button id="btnLavanda" class="btn border text-white" style="background-color: #BD99E8;">Lavanda</button>
                <button id="btnCielo" class="btn border" style="background-color: #A8C7FF;">Cielo</button>
            </div>
        </section>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
